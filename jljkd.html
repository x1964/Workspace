                    },
                    {
                        element: '#toggleTheme',
                        title: 'Customize 🎨',
                        text: 'Toggle between light and dark mode for your comfort.',
                        position: 'right'
                    }
                ];

                let currentStep = 0;

                const showStep = () => {
                    if (currentStep >= steps.length) {
                        document.getElementById('tutorialOverlay')?.classList.add('hidden');
                        document.querySelectorAll('.tutorial-highlight').forEach(el => el.classList.remove('tutorial-highlight'));
                        UI.showToast('Tutorial completed! You are ready to collaborate.', 'success');
                        return;
                    }

                    const step = steps[currentStep];
                    const element = document.querySelector(step.element);

                    if (element) {
                        // Remove previous highlights
                        document.querySelectorAll('.tutorial-highlight').forEach(el => el.classList.remove('tutorial-highlight'));

                        // Add highlight
                        element.classList.add('tutorial-highlight');

                        // Show overlay
                        const overlay = document.getElementById('tutorialOverlay');
                        overlay.classList.remove('hidden');

                        // Create tooltip
                        const existingTooltip = document.getElementById('tutorialTooltip');
                        if (existingTooltip) existingTooltip.remove();

                        const tooltip = document.createElement('div');
                        tooltip.id = 'tutorialTooltip';
                        tooltip.className = 'fixed z-50 bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-6 max-w-sm animate-fadeInUp';

                        const rect = element.getBoundingClientRect();
                        let top = rect.bottom + 20;
                        let left = rect.left;

                        if (step.position === 'right') {
                            top = rect.top;
                            left = rect.right + 20;
                        }

                        // Boundary checks
                        if (left + 320 > window.innerWidth) left = window.innerWidth - 340;
                        if (top + 200 > window.innerHeight) top = rect.top - 220;

                        tooltip.style.top = `${top}px`;
                        tooltip.style.left = `${left}px`;

                        tooltip.innerHTML = `
                            <h4 class="font-bold text-lg mb-2">${step.title}</h4>
                            <p class="text-gray-600 dark:text-gray-400 text-sm mb-4">${step.text}</p>
                            <div class="flex justify-between items-center">
                                <span class="text-xs text-gray-400">Step ${currentStep + 1} of ${steps.length}</span>
                                <button onclick="App.nextTutorialStep()" class="btn-primary text-white px-4 py-2 rounded-lg font-semibold text-sm">
                                    ${currentStep === steps.length - 1 ? 'Finish' : 'Next →'}
                                </button>
                            </div>
                        `;

                        document.body.appendChild(tooltip);
                    }

                    currentStep++;
                };

                this.nextTutorialStep = showStep;
                showStep();
            },

            // ==========================================
            // HELPERS
            // ==========================================

            calculateStats() {
                const now = Date.now();
                const weekAgo = now - (7 * 24 * 60 * 60 * 1000);

                return {
                    total: Store.data.ideas.length,
                    thisWeek: Store.data.ideas.filter(i => i.createdAt > weekAgo).length,
                    discussing: Store.data.ideas.filter(i => i.status === 'discussing').length,
                    implemented: Store.data.ideas.filter(i => i.status === 'implemented').length
                };
            }
        };

        // Initialize App when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            App.init();
        });

        // Expose App to window for onclick handlers
        window.App = App;
    </script>
</body>
</html>
