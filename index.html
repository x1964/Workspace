<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevHub Elite | منصة الفريق المتكاملة</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600;700&family=Fira+Code&display=swap');

    body {
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      transition: 0.3s;
    }

    .glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(15px);
    }

    .comment-bubble {
      position: relative;
      background: #f3f4f6;
      border-radius: 18px;
      padding: 12px 16px;
    }

    .dark .comment-bubble {
      background: #3a3a3c;
    }

    .nav-active {
      color: #0A84FF;
      border-bottom: 2px solid #0A84FF;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .page-anim {
      animation: slideIn 0.3s ease-out;
    }
  </style>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { darkBg: '#1C1C1E', brandBlue: '#0A84FF', surfaceDark: '#2C2C2E' }
        }
      }
    }
  </script>
</head>

<body class="bg-[#F2F2F7] dark:bg-darkBg text-slate-900 dark:text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, createContext, useContext } = React;

    const AppContext = createContext();

    const AppProvider = ({ children }) => {
      const [isDark, setIsDark] = useState(true);
      const [view, setView] = useState('feed');
      const [user, setUser] = useState(() => JSON.parse(localStorage.getItem('user_v4')));

      // البيانات الأساسية
      const [posts, setPosts] = useState(() => JSON.parse(localStorage.getItem('posts_v4')) || []);
      const [tasks, setTasks] = useState(() => JSON.parse(localStorage.getItem('tasks_v4')) || []);

      useEffect(() => {
        localStorage.setItem('user_v4', JSON.stringify(user));
        localStorage.setItem('posts_v4', JSON.stringify(posts));
        localStorage.setItem('tasks_v4', JSON.stringify(tasks));
      }, [user, posts, tasks]);

      return (
        <AppContext.Provider value={{ isDark, setIsDark, view, setView, user, setUser, posts, setPosts, tasks, setTasks }}>
          <div className={isDark ? 'dark' : ''}>{children}</div>
        </AppContext.Provider>
      );
    };

    // --- المكونات العامة ---
    const Header = () => {
      const { isDark, setIsDark, setView, view, user, setUser } = useContext(AppContext);
      const navLink = (target, label) => (
        <button
          onClick={() => setView(target)}
          className={`pb-4 px-2 font-bold text-sm transition-all ${view === target ? 'text-brandBlue border-b-2 border-brandBlue' : 'text-gray-500 hover:text-brandBlue'}`}
        >
          {label}
        </button>
      );

      return (
        <nav className="sticky top-0 z-50 bg-white/80 dark:bg-darkBg/80 backdrop-blur-xl border-b dark:border-gray-800">
          <div className="max-w-6xl mx-auto px-6 flex items-center justify-between h-16">
            <div className="flex items-center gap-8">
              <h1 className="text-2xl font-black text-brandBlue tracking-tighter">DEV_ELITE</h1>
              <div className="hidden md:flex gap-6 mt-4">
                {navLink('feed', 'الرئيسية')}
                {navLink('tasks', 'المهام')}
                {navLink('admin', 'الأعضاء')}
              </div>
            </div>
            <div className="flex items-center gap-4">
              <button onClick={() => setIsDark(!isDark)} className="p-2 rounded-xl bg-gray-100 dark:bg-gray-800 text-lg">
                {isDark ? '☀️' : '🌙'}
              </button>
              <div className="flex items-center gap-3 bg-gray-100 dark:bg-gray-800 p-1 pr-3 rounded-full border dark:border-gray-700 cursor-pointer" onClick={() => setView('profile')}>
                <span className="text-xs font-bold hidden sm:block">{user.name}</span>
                <div className="w-8 h-8 rounded-full bg-brandBlue text-white flex items-center justify-center font-bold">A</div>
              </div>
            </div>
          </div>
        </nav>
      );
    };

    // --- صفحة التغذية الإخبارية (Feed) ---
    const FeedPage = () => {
      const { posts, setPosts, user } = useContext(AppContext);
      const [text, setText] = useState("");

      const handlePost = () => {
        if (!text.trim()) return;
        const newPost = { id: Date.now(), author: user.name, content: text, likes: 0, comments: [], date: 'الآن' };
        setPosts([newPost, ...posts]);
        setText("");
      };

      return (
        <div className="max-w-2xl mx-auto py-8 page-anim">
          <div className="bg-white dark:bg-surfaceDark p-6 rounded-[2rem] shadow-xl border dark:border-gray-800 mb-8">
            <textarea
              value={text} onChange={(e) => setText(e.target.value)}
              placeholder="شارك فكرة أو كود مع الفريق..."
              className="w-full h-24 bg-transparent outline-none text-lg resize-none"
            ></textarea>
            <div className="flex justify-end pt-4 border-t dark:border-gray-800">
              <button onClick={handlePost} className="bg-brandBlue text-white px-6 py-2 rounded-xl font-bold hover:opacity-90">نشر</button>
            </div>
          </div>

          {posts.map(post => (
            <div key={post.id} className="bg-white dark:bg-surfaceDark rounded-[2rem] p-6 mb-6 shadow-sm border dark:border-gray-800">
              <div className="flex items-center gap-3 mb-4">
                <div className="w-10 h-10 rounded-xl bg-brandBlue/10 text-brandBlue flex items-center justify-center font-bold">{post.author[0]}</div>
                <div><h4 className="font-bold text-sm">{post.author}</h4><p className="text-[10px] text-gray-500">{post.date}</p></div>
              </div>
              <p className="text-gray-700 dark:text-gray-300 leading-relaxed mb-6">{post.content}</p>

              <div className="space-y-4 border-t dark:border-gray-800 pt-4">
                {post.comments.map(c => (
                  <div key={c.id} className="flex gap-3">
                    <div className="w-8 h-8 rounded-full bg-gray-200 dark:bg-gray-700 flex-shrink-0"></div>
                    <div className="comment-bubble flex-1">
                      <div className="text-[10px] font-bold text-brandBlue mb-1">{c.user}</div>
                      <div className="text-xs">{c.text}</div>
                    </div>
                  </div>
                ))}
                <div className="flex gap-2">
                  <input
                    placeholder="اكتب تعليقاً..."
                    className="flex-1 bg-gray-100 dark:bg-gray-800 rounded-xl px-4 py-2 text-xs outline-none"
                    onKeyDown={(e) => {
                      if (e.key === 'Enter' && e.target.value) {
                        const updated = posts.map(p => p.id === post.id ? { ...p, comments: [...p.comments, { id: Date.now(), user: user.name, text: e.target.value }] } : p);
                        setPosts(updated);
                        e.target.value = "";
                      }
                    }}
                  />
                </div>
              </div>
            </div>
          ))}
        </div>
      );
    };

    // --- صفحة المهام (Tasks) ---
    const TasksPage = () => {
      const { tasks, setTasks } = useContext(AppContext);
      const [taskInput, setTaskInput] = useState("");

      return (
        <div className="max-w-4xl mx-auto py-8 page-anim">
          <h2 className="text-3xl font-black mb-8 text-center">لوحة مهام الفريق 🛠️</h2>
          <div className="flex gap-2 mb-8">
            <input value={taskInput} onChange={e => setTaskInput(e.target.value)} className="flex-1 p-4 rounded-2xl bg-white dark:bg-surfaceDark outline-none shadow-sm" placeholder="أضف مهمة جديدة (مثلاً: تصميم اللوجو)" />
            <button onClick={() => { if (taskInput) { setTasks([...tasks, { id: Date.now(), text: taskInput, done: false }]); setTaskInput(""); } }} className="bg-brandBlue text-white px-8 rounded-2xl font-bold">إضافة</button>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {tasks.map(t => (
              <div key={t.id} className={`p-5 rounded-2xl border flex items-center justify-between transition-all ${t.done ? 'bg-green-500/10 border-green-500/20 opacity-60' : 'bg-white dark:bg-surfaceDark dark:border-gray-800'}`}>
                <span className={t.done ? 'line-through' : 'font-bold'}>{t.text}</span>
                <input type="checkbox" checked={t.done} onChange={() => setTasks(tasks.map(x => x.id === t.id ? { ...x, done: !x.done } : x))} className="w-5 h-5 accent-brandBlue" />
              </div>
            ))}
          </div>
        </div>
      );
    };

    // --- صفحة الملف الشخصي (Profile) ---
    const ProfilePage = () => {
      const { user, setUser, setView } = useContext(AppContext);
      return (
        <div className="max-w-md mx-auto py-20 text-center page-anim">
          <div className="w-32 h-32 bg-brandBlue mx-auto rounded-[2.5rem] flex items-center justify-center text-5xl text-white mb-6 shadow-2xl">A</div>
          <h2 className="text-3xl font-black mb-2">{user.name}</h2>
          <p className="text-gray-500 mb-8 font-mono tracking-widest uppercase text-xs">Verified Developer</p>
          <button onClick={() => { setUser(null); setView('login'); }} className="w-full bg-red-500/10 text-red-500 p-4 rounded-2xl font-bold hover:bg-red-500 hover:text-white transition-all">تسجيل الخروج</button>
        </div>
      );
    };

    const Login = () => {
      const { setUser } = useContext(AppContext);
      const [n, setN] = useState("");
      return (
        <div className="min-h-screen flex items-center justify-center p-6 bg-slate-200 dark:bg-black">
          <div className="bg-white dark:bg-darkBg p-12 rounded-[3rem] shadow-2xl w-full max-w-sm text-center">
            <div className="text-6xl mb-6">⚡</div>
            <h2 className="text-3xl font-black mb-8">DevHub Join</h2>
            <input value={n} onChange={e => setN(e.target.value)} placeholder="اسمك المستعار" className="w-full p-4 rounded-2xl bg-gray-100 dark:bg-gray-800 mb-4 text-center font-bold outline-none border-2 border-transparent focus:border-brandBlue transition-all" />
            <button onClick={() => n && setUser({ name: n })} className="w-full bg-brandBlue text-white p-4 rounded-2xl font-black shadow-lg">دخول</button>
          </div>
        </div>
      );
    };

    const App = () => {
      const { user, view } = useContext(AppContext);
      if (!user) return <Login />;
      return (
        <div>
          <Header />
          <main className="px-6">
            {view === 'feed' && <FeedPage />}
            {view === 'tasks' && <TasksPage />}
            {view === 'profile' && <ProfilePage />}
            {view === 'admin' && (
              <div className="max-w-2xl mx-auto py-20 text-center page-anim opacity-50">
                <h2 className="text-4xl font-black mb-4">قريباً.. 🏗️</h2>
                <p>هنا ستتمكن من رؤية إحصائيات الفريق بالكامل.</p>
              </div>
            )}
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AppProvider><App /></AppProvider>);
  </script>
</body>

</html>
