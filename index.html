<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevConnect Pro | Workspace</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .font-code {
      font-family: 'JetBrains Mono', monospace;
    }

    .animate-fade-in {
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { darkBg: '#1C1C1E', brandBlue: '#0A84FF', surface: '#2C2C2E' }
        }
      }
    }
  </script>
</head>

<body class="bg-slate-50 dark:bg-darkBg text-slate-900 dark:text-slate-100 transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, createContext, useContext } = React;

    const GlobalContext = createContext();

    // --- Provider الأساسي لإدارة بيانات الفريق ---
    const GlobalProvider = ({ children }) => {
      const [darkMode, setDarkMode] = useState(true);
      const [user, setUser] = useState(null);
      const [view, setView] = useState('feed');
      const [notifications, setNotifications] = useState([
        { id: 1, text: "Sarah commented on your post", read: false },
        { id: 2, text: "New member joined the team", read: true }
      ]);
      const [posts, setPosts] = useState([
        { id: 1, author: 'Omar Dev', content: 'Working on the new API architecture! 💻', likes: 12, comments: [{ id: 1, text: "Looks clean!", user: "DevNode" }], date: '10m ago' },
      ]);
      const [members, setMembers] = useState([
        { id: 1, name: 'Omar Dev', role: 'Admin', status: 'online' },
        { id: 2, name: 'DevNode', role: 'Member', status: 'away' }
      ]);

      return (
        <GlobalContext.Provider value={{
          darkMode, setDarkMode, user, setUser, view, setView,
          posts, setPosts, members, setMembers, notifications
        }}>
          <div className={darkMode ? 'dark' : ''}>{children}</div>
        </GlobalContext.Provider>
      );
    };

    // --- مكونات واجهة المستخدم ---

    const NavItem = ({ icon, label, target }) => {
      const { view, setView } = useContext(GlobalContext);
      const active = view === target;
      return (
        <button onClick={() => setView(target)} className={`flex items-center gap-2 px-4 py-2 rounded-xl transition-all ${active ? 'bg-brandBlue text-white' : 'hover:bg-gray-200 dark:hover:bg-gray-800'}`}>
          <span className="font-semibold text-sm">{label}</span>
        </button>
      );
    }

    const Header = () => {
      const { darkMode, setDarkMode, user, setUser, notifications, setView } = useContext(GlobalContext);
      const unreadCount = notifications.filter(n => !n.read).length;

      return (
        <nav className="border-b border-gray-200 dark:border-gray-800 bg-white/70 dark:bg-darkBg/70 backdrop-blur-xl sticky top-0 z-50">
          <div className="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div className="flex items-center gap-8">
              <div className="text-2xl font-black text-brandBlue tracking-tighter cursor-pointer" onClick={() => setView('feed')}>DEV.HUB</div>
              {user && (
                <div className="hidden md:flex gap-2">
                  <NavItem label="Feed" target="feed" />
                  <NavItem label="Team" target="admin" />
                  <NavItem label="Tasks" target="tasks" />
                </div>
              )}
            </div>

            <div className="flex items-center gap-4">
              <button onClick={() => setDarkMode(!darkMode)} className="p-2 rounded-lg bg-gray-100 dark:bg-gray-800">
                {darkMode ? '☀️' : '🌙'}
              </button>

              {user ? (
                <div className="flex items-center gap-4">
                  <div className="relative cursor-pointer">
                    <span className="text-xl">🔔</span>
                    {unreadCount > 0 && <span className="absolute -top-1 -right-1 bg-red-500 text-[10px] text-white w-4 h-4 rounded-full flex items-center justify-center">{unreadCount}</span>}
                  </div>
                  <div className="w-8 h-8 rounded-full bg-gradient-to-tr from-brandBlue to-purple-500" onClick={() => setView('profile')}></div>
                  <button onClick={() => setUser(null)} className="text-xs font-bold text-red-500">Exit</button>
                </div>
              ) : (
                <button onClick={() => setView('login')} className="bg-brandBlue text-white px-5 py-2 rounded-full font-bold shadow-lg shadow-brandBlue/20">Join Team</button>
              )}
            </div>
          </div>
        </nav>
      );
    };

    const PostCard = ({ post }) => {
      const [comment, setComment] = useState("");
      const { setPosts, posts } = useContext(GlobalContext);

      const addComment = () => {
        const updatedPosts = posts.map(p => {
          if (p.id === post.id) return { ...p, comments: [...p.comments, { id: Date.now(), text: comment, user: "You" }] };
          return p;
        });
        setPosts(updatedPosts);
        setComment("");
      }

      return (
        <div className="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl p-6 mb-6 animate-fade-in">
          <div className="flex justify-between items-center mb-4">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-brandBlue/10 flex items-center justify-center text-brandBlue font-bold">
                {post.author[0]}
              </div>
              <div>
                <h4 className="font-bold text-sm">{post.author}</h4>
                <p className="text-xs text-gray-500 font-code">{post.date}</p>
              </div>
            </div>
          </div>
          <p className="text-gray-700 dark:text-gray-300 mb-4 leading-relaxed">{post.content}</p>
          <div className="flex gap-4 border-y border-gray-100 dark:border-gray-800 py-3 mb-4">
            <button className="text-sm flex items-center gap-1 hover:text-brandBlue">❤️ {post.likes}</button>
            <button className="text-sm flex items-center gap-1">💬 {post.comments.length}</button>
          </div>
          <div className="space-y-2 mb-4">
            {post.comments.map(c => (
              <div key={c.id} className="text-xs bg-gray-50 dark:bg-gray-800/50 p-2 rounded-lg">
                <span className="font-bold text-brandBlue mr-2">{c.user}:</span> {c.text}
              </div>
            ))}
          </div>
          <div className="flex gap-2">
            <input value={comment} onChange={e => setComment(e.target.value)} placeholder="Write a comment..." className="flex-1 bg-gray-100 dark:bg-gray-800 border-none rounded-lg px-3 py-2 text-xs outline-none focus:ring-1 focus:ring-brandBlue" />
            <button onClick={addComment} className="text-xs font-bold text-brandBlue">Reply</button>
          </div>
        </div>
      );
    };

    const ProfileView = () => (
      <div className="max-w-2xl mx-auto text-center py-10">
        <div className="w-24 h-24 bg-brandBlue mx-auto rounded-3xl mb-4 flex items-center justify-center text-4xl text-white font-bold shadow-2xl">A</div>
        <h2 className="text-2xl font-bold">Admin Workspace</h2>
        <p className="text-gray-500 font-code text-sm">Fullstack Developer • Senior Member</p>
        <div className="grid grid-cols-3 gap-4 mt-8">
          <div className="bg-white dark:bg-gray-900 p-4 rounded-2xl border border-gray-100 dark:border-gray-800">
            <div className="text-xl font-bold">42</div>
            <div className="text-xs text-gray-500">Commits</div>
          </div>
          <div className="bg-white dark:bg-gray-900 p-4 rounded-2xl border border-gray-100 dark:border-gray-800">
            <div className="text-xl font-bold">12</div>
            <div className="text-xs text-gray-500">Projects</div>
          </div>
          <div className="bg-white dark:bg-gray-900 p-4 rounded-2xl border border-gray-100 dark:border-gray-800">
            <div className="text-xl font-bold">850</div>
            <div className="text-xs text-gray-500">Rep</div>
          </div>
        </div>
      </div>
    );

    const App = () => {
      const { view, setUser, user } = useContext(GlobalContext);

      if (view === 'login') return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="bg-white dark:bg-gray-900 p-10 rounded-3xl shadow-2xl w-full max-w-md border border-gray-200 dark:border-gray-800">
            <h2 className="text-3xl font-black mb-2 tracking-tighter">Enter the Hub.</h2>
            <p className="text-gray-500 mb-8 text-sm">Join the developer elite.</p>
            <input className="w-full bg-gray-100 dark:bg-gray-800 p-4 rounded-2xl mb-4 outline-none focus:ring-2 focus:ring-brandBlue" placeholder="Access Token" type="password" />
            <button onClick={() => setUser({ name: 'Admin' })} className="w-full bg-brandBlue text-white p-4 rounded-2xl font-bold shadow-lg shadow-brandBlue/30 hover:scale-[1.02] transition-transform">Authorize</button>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen">
          <Header />
          <main className="max-w-7xl mx-auto px-6 py-8">
            {view === 'feed' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div className="lg:col-span-8 max-w-2xl">
                  <PostCard post={{ id: 0, author: "System", content: "Welcome to the new developer hub! Start by sharing your progress.", date: "Now", likes: 0, comments: [] }} />
                  <PostSectionContent />
                </div>
                <div className="lg:col-span-4 space-y-6">
                  <div className="bg-brandBlue p-6 rounded-3xl text-white shadow-xl">
                    <h3 className="font-bold mb-2">Build Together 🚀</h3>
                    <p className="text-sm opacity-90">Our team sprint ends in 3 days. Keep the momentum going!</p>
                  </div>
                  <MembersListContent />
                </div>
              </div>
            )}
            {view === 'admin' && <AdminPanelContent />}
            {view === 'profile' && <ProfileView />}
          </main>
        </div>
      );
    };

    // المكونات الفرعية المنظمة لسهولة التعديل
    const PostSectionContent = () => {
      const { posts } = useContext(GlobalContext);
      return <div>{posts.map(p => <PostCard key={p.id} post={p} />)}</div>;
    };

    const MembersListContent = () => {
      const { members } = useContext(GlobalContext);
      return (
        <div className="bg-white dark:bg-gray-900 rounded-3xl p-6 border border-gray-100 dark:border-gray-800">
          <h3 className="font-bold text-sm mb-4 text-gray-400 uppercase tracking-widest">Active Peers</h3>
          {members.map(m => (
            <div key={m.id} className="flex items-center gap-3 mb-4">
              <div className={`w-2 h-2 rounded-full ${m.status === 'online' ? 'bg-green-500' : 'bg-orange-400'}`}></div>
              <span className="font-medium text-sm">{m.name}</span>
              <span className="text-[10px] bg-gray-100 dark:bg-gray-800 px-2 py-0.5 rounded text-gray-500">{m.role}</span>
            </div>
          ))}
        </div>
      );
    };

    const AdminPanelContent = () => {
      const { members, setMembers } = useContext(GlobalContext);
      return (
        <div className="bg-white dark:bg-gray-900 rounded-3xl p-8 border border-gray-200 dark:border-gray-800">
          <h2 className="text-2xl font-bold mb-6">Manage Your Fleet</h2>
          <div className="space-y-4">
            {members.map(m => (
              <div key={m.id} className="flex items-center justify-between p-4 bg-gray-50 dark:bg-gray-800/50 rounded-2xl">
                <div className="flex items-center gap-4">
                  <div className="w-10 h-10 bg-gray-200 dark:bg-gray-700 rounded-full"></div>
                  <div>
                    <div className="font-bold">{m.name}</div>
                    <div className="text-xs text-gray-500">{m.role}</div>
                  </div>
                </div>
                <div className="flex gap-2">
                  <button className="px-3 py-1 bg-brandBlue/10 text-brandBlue text-xs rounded-lg font-bold">Edit</button>
                  <button onClick={() => setMembers(members.filter(mem => mem.id !== m.id))} className="px-3 py-1 bg-red-500/10 text-red-500 text-xs rounded-lg font-bold">Kick</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<GlobalProvider><App /></GlobalProvider>);
  </script>
</body>

</html>
