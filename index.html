<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevHub Ultimate | المنصة المتكاملة</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=JetBrains+Mono&display=swap');

    body {
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      transition: 0.3s;
      scroll-behavior: smooth;
    }

    .glass-nav {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    .dark .glass-nav {
      background: rgba(28, 28, 30, 0.8);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .card-anim {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-anim:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #0A84FF;
      border-radius: 10px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .page-transition {
      animation: fadeIn 0.4s ease-out forwards;
    }
  </style>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: '#0A84FF', darkBg: '#121212', cardDark: '#1E1E1E' }
        }
      }
    }
  </script>
</head>

<body class="bg-gray-50 dark:bg-darkBg text-slate-900 dark:text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, createContext, useContext, useMemo } = React;

    const AppContext = createContext();

    const AppProvider = ({ children }) => {
      const [isDark, setIsDark] = useState(true);
      const [view, setView] = useState('feed');
      const [user, setUser] = useState(() => JSON.parse(localStorage.getItem('dev_user_final')));
      const [posts, setPosts] = useState(() => JSON.parse(localStorage.getItem('dev_posts_final')) || []);
      const [tasks, setTasks] = useState(() => JSON.parse(localStorage.getItem('dev_tasks_final')) || []);
      const [members] = useState([
        { id: 1, name: 'أحمدLead', role: 'Full-Stack', status: 'online' },
        { id: 2, name: 'سارة Design', role: 'UI/UX', status: 'away' },
        { id: 3, name: 'عمر Dev', role: 'Backend', status: 'online' }
      ]);

      useEffect(() => {
        localStorage.setItem('dev_user_final', JSON.stringify(user));
        localStorage.setItem('dev_posts_final', JSON.stringify(posts));
        localStorage.setItem('dev_tasks_final', JSON.stringify(tasks));
      }, [user, posts, tasks]);

      return (
        <AppContext.Provider value={{ isDark, setIsDark, view, setView, user, setUser, posts, setPosts, tasks, setTasks, members }}>
          <div className={isDark ? 'dark' : ''}>{children}</div>
        </AppContext.Provider>
      );
    };

    // --- المكونات المساعدة ---
    const SidebarItem = ({ id, icon, label }) => {
      const { view, setView } = useContext(AppContext);
      const active = view === id;
      return (
        <button onClick={() => setView(id)} className={`flex items-center gap-3 w-full p-4 rounded-2xl transition-all ${active ? 'bg-brand text-white shadow-lg shadow-brand/30' : 'hover:bg-gray-100 dark:hover:bg-gray-800 opacity-60 hover:opacity-100'}`}>
          <span className="text-xl">{icon}</span>
          <span className="font-bold text-sm">{label}</span>
        </button>
      );
    };

    // --- صفحة الإدارة / الأعضاء ---
    const TeamPage = () => {
      const { members } = useContext(AppContext);
      return (
        <div className="page-transition space-y-6">
          <h2 className="text-3xl font-black mb-8">فريق التطوير 👥</h2>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {members.map(m => (
              <div key={m.id} className="bg-white dark:bg-cardDark p-6 rounded-[2rem] border dark:border-gray-800 flex items-center gap-4 card-anim">
                <div className="w-16 h-16 rounded-2xl bg-brand/10 text-brand flex items-center justify-center text-2xl font-bold">{m.name[0]}</div>
                <div>
                  <h4 className="font-bold">{m.name}</h4>
                  <p className="text-xs text-gray-500 mb-2">{m.role}</p>
                  <span className={`px-3 py-1 rounded-full text-[10px] font-bold ${m.status === 'online' ? 'bg-green-500/10 text-green-500' : 'bg-orange-500/10 text-orange-500'}`}>
                    {m.status === 'online' ? 'متصل الآن' : 'بعيد'}
                  </span>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    };

    // --- صفحة المهام ---
    const TasksPage = () => {
      const { tasks, setTasks } = useContext(AppContext);
      const [input, setInput] = useState("");

      const addTask = () => {
        if (!input.trim()) return;
        setTasks([{ id: Date.now(), text: input, done: false }, ...tasks]);
        setInput("");
      };

      return (
        <div className="page-transition max-w-3xl mx-auto">
          <h2 className="text-3xl font-black mb-8 text-center">خارطة الطريق 🗺️</h2>
          <div className="bg-white dark:bg-cardDark p-4 rounded-[2rem] flex gap-3 shadow-xl mb-10 border dark:border-gray-800">
            <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && addTask()} className="flex-1 bg-transparent px-4 outline-none font-bold" placeholder="ما هي المهمة القادمة؟" />
            <button onClick={addTask} className="bg-brand text-white px-8 py-3 rounded-2xl font-bold hover:scale-105 transition-all">إضافة</button>
          </div>
          <div className="space-y-4">
            {tasks.map(t => (
              <div key={t.id} className={`p-6 rounded-[1.5rem] border flex items-center justify-between transition-all ${t.done ? 'bg-gray-100 dark:bg-gray-800/30 opacity-50 border-transparent' : 'bg-white dark:bg-cardDark border-gray-100 dark:border-gray-800 shadow-sm'}`}>
                <div className="flex items-center gap-4">
                  <input type="checkbox" checked={t.done} onChange={() => setTasks(tasks.map(x => x.id === t.id ? { ...x, done: !x.done } : x))} className="w-6 h-6 rounded-lg accent-brand" />
                  <span className={`font-bold ${t.done ? 'line-through' : ''}`}>{t.text}</span>
                </div>
                <button onClick={() => setTasks(tasks.filter(x => x.id !== t.id))} className="text-red-500 opacity-0 hover:opacity-100 transition-opacity font-bold text-xs">حذف</button>
              </div>
            ))}
          </div>
        </div>
      );
    };

    // --- المكون الرئيسي ---
    const App = () => {
      const { user, setUser, view, setView, isDark, setIsDark, posts, setPosts } = useContext(AppContext);
      const [postInput, setPostInput] = useState("");

      if (!user) return (
        <div className="min-h-screen flex items-center justify-center p-6 bg-slate-100 dark:bg-black">
          <div className="bg-white dark:bg-cardDark p-12 rounded-[3rem] shadow-2xl w-full max-w-sm text-center page-transition">
            <div className="text-6xl mb-6 animate-bounce">🚀</div>
            <h2 className="text-3xl font-black mb-2 tracking-tighter text-brand">DevHub Elite</h2>
            <p className="text-gray-500 mb-10 text-sm font-medium">مساحة عمل مخصصة للمحترفين</p>
            <input id="userName" placeholder="اكتب اسمك للدخول" className="w-full p-5 rounded-2xl bg-gray-50 dark:bg-gray-800 mb-6 text-center font-bold outline-none border-2 border-transparent focus:border-brand transition-all" />
            <button onClick={() => { const n = document.getElementById('userName').value; if (n) setUser({ name: n }) }} className="w-full bg-brand text-white p-5 rounded-2xl font-black shadow-xl shadow-brand/30 hover:scale-[1.02] active:scale-95 transition-all">ابدأ الآن</button>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen flex flex-col md:flex-row">
          {/* القائمة الجانبية - Sidebar */}
          <aside className="w-full md:w-72 bg-white dark:bg-cardDark border-l dark:border-gray-800 p-6 flex flex-col gap-8 z-40">
            <div className="text-2xl font-black text-brand tracking-tighter">DEV_ELITE</div>
            <div className="flex flex-col gap-2">
              <SidebarItem id="feed" icon="🏠" label="الرئيسية" />
              <SidebarItem id="tasks" icon="📋" label="المهام" />
              <SidebarItem id="team" icon="👥" label="الفريق" />
            </div>
            <div className="mt-auto pt-6 border-t dark:border-gray-800">
              <button onClick={() => setIsDark(!isDark)} className="w-full p-4 rounded-2xl bg-gray-50 dark:bg-gray-800 font-bold mb-4">
                {isDark ? '☀️ الوضع الفاتح' : '🌙 الوضع الليلي'}
              </button>
              <button onClick={() => setUser(null)} className="w-full p-4 text-red-500 font-bold hover:bg-red-50 dark:hover:bg-red-500/10 rounded-2xl transition-all text-sm">تسجيل الخروج</button>
            </div>
          </aside>

          {/* المحتوى الرئيسي */}
          <main className="flex-1 p-6 md:p-12 custom-scrollbar overflow-y-auto">
            {view === 'feed' && (
              <div className="page-transition max-w-2xl mx-auto">
                <div className="bg-white dark:bg-cardDark p-6 rounded-[2.5rem] shadow-xl mb-10 border dark:border-gray-800">
                  <textarea value={postInput} onChange={e => setPostInput(e.target.value)} className="w-full h-32 bg-transparent outline-none text-lg font-medium resize-none" placeholder={`ما الجديد في مشروعنا يا ${user.name}؟`}></textarea>
                  <div className="flex justify-end pt-4 border-t dark:border-gray-800">
                    <button onClick={() => { if (postInput) { setPosts([{ id: Date.now(), author: user.name, content: postInput, comments: [] }, ...posts]); setPostInput(""); } }} className="bg-brand text-white px-10 py-3 rounded-2xl font-black shadow-lg shadow-brand/20 hover:opacity-90 active:scale-95 transition-all">نشر الفكرة</button>
                  </div>
                </div>
                {posts.map(post => (
                  <div key={post.id} className="bg-white dark:bg-cardDark p-8 rounded-[2.5rem] mb-8 border dark:border-gray-800 card-anim">
                    <div className="flex items-center gap-4 mb-6">
                      <div className="w-12 h-12 rounded-2xl bg-brand/10 text-brand flex items-center justify-center font-black text-xl">{post.author[0]}</div>
                      <div><h4 className="font-bold">{post.author}</h4><p className="text-[10px] text-gray-400 font-mono">ID: {post.id.toString().slice(-5)}</p></div>
                    </div>
                    <p className="text-gray-800 dark:text-gray-200 text-lg leading-relaxed mb-8">{post.content}</p>
                    <div className="pt-6 border-t dark:border-gray-800">
                      <div className="space-y-4">
                        {post.comments.map(c => (
                          <div key={c.id} className="flex gap-3 items-start animate-fadeIn">
                            <div className="w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-800 flex-shrink-0"></div>
                            <div className="bg-gray-50 dark:bg-gray-800/50 px-5 py-3 rounded-[1.5rem] flex-1">
                              <div className="text-[10px] font-bold text-brand mb-1 uppercase tracking-widest">{c.user}</div>
                              <div className="text-sm font-medium">{c.text}</div>
                            </div>
                          </div>
                        ))}
                        <input placeholder="أضف تعليقاً واضغط Enter..." className="w-full bg-gray-50 dark:bg-gray-800/50 p-4 rounded-2xl text-xs font-bold outline-none focus:ring-1 focus:ring-brand"
                          onKeyDown={e => {
                            if (e.key === 'Enter' && e.target.value) {
                              setPosts(posts.map(p => p.id === post.id ? { ...p, comments: [...p.comments, { id: Date.now(), user: user.name, text: e.target.value }] } : p));
                              e.target.value = "";
                            }
                          }}
                        />
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
            {view === 'tasks' && <TasksPage />}
            {view === 'team' && <TeamPage />}
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AppProvider><App /></AppProvider>);
  </script>
</body>

</html>
